services:
  llama3:
    build:
      context: ./build
    ports:
      - 5285:5000
    environment:
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - turbo_network
    container_name: llama3_container
    image: llama3_image

networks:
  turbo_network:
    external: false
